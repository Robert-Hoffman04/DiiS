# desmumewii GBA conformance suite (PLAN.md §4.3 item 9 / §5.3).
#
#   id | rom (relative to tools/gba-refcheck) | probe define | until-frame | timeout | jitdefs | label
#
# id            short id; also the golden/<id>.txt and results/<stamp>/<id>/
#               dirname stem
# rom           built .gba filename, from tools/gba-refcheck/build_roms.sh
#               (run that first - .gba outputs are gitignored, not committed)
# probe define  -D flag main.cpp gates the soak probe behind (see
#               source/main.cpp DESMUME_GBA_*_SOAK); each one also switches
#               slot-2 to NDS_ADDON_NONE to sidestep the CFlash boot hang
#               documented in PLAN.md §4.3 item 8
# until-frame   capture.py stop condition - a perf-zones frame counter row
#               (DESMUME_PERFZONES, one CSV row every 60 frames) or the
#               probe's own "frame=" field, whichever reports it first.
#               Chosen comfortably past the point the probe's own
#               harness_profile_emitf lines are known to have been emitted.
# timeout       hard safety-net seconds passed to capture.py --timeout
# jitdefs       override for this row's JITDEFS; blank = the suite default
#               "-DDESMUME_JIT_ARM7 -DDESMUME_JIT_ARM9_ON". waitcntsoak pins
#               this to "-" (empty JITDEFS, pure interpreter) because
#               WAITCNT cycle accounting is interpreter-only per PLAN.md
#               §4.3 item 4's own commit message ("the JIT's own cost
#               tables are untouched ... JIT compiles a static per-opcode
#               cost with no per-access address lookup to hook WAITCNT
#               into") - running it under the JIT was tried while building
#               this suite and produced fast/slow ticks in the WRONG
#               direction (JIT timing noise, not a real regression); this
#               is the fix, not a workaround for a bug.
# label         human name for the report
#
# Correctness gate, not a benchmark: same ROM + same direct boot + no input
# is deterministic, so each probe's captured PKT_PROFILE lines are diffed
# byte-for-byte against golden/<id>.txt (tools/gba-refcheck/run_conformance.sh
# --record writes/refreshes golden/) - any difference is a real regression,
# not noise. Same convention as tools/benchmark/wrestlers.conf's screenshot
# diff, applied to profile-log text instead of pixels.

irqsoak     | irqsoak.gba | DESMUME_GBA_IRQ_SOAK       | 1024 | 150 |   | ARM7 JIT vs GBA VBlank/Timer0 IRQ dispatch soak
apusoak     | dsound.gba  | DESMUME_GBA_APU_SOAK       | 40   | 90  |   | DirectSound FIFO A mix (dsound.s square wave)
waitcntsoak | waitcnt.gba | DESMUME_GBA_WAITCNT_SOAK   | 300  | 90  | - | WAITCNT-driven cartridge ROM wait-state timing (interpreter-only, see jitdefs note above)
dmasoak     | dmavcap.gba | DESMUME_GBA_DMA_SOAK       | 300  | 90  |   | DMA3 Video Capture Special-timing fired-scanline sequence
sstest      | irqsoak.gba | DESMUME_GBA_SAVESTATE_SOAK | 950  | 150 |   | GBA savestate save/load determinism (checkpoint + 300f replay)
