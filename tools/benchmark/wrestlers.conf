# desmumewii correctness-probe test ROMs.
#
#   id | tool-dir (under tools/) | built .nds filename | probe define | settle frame | label
#
# id            short id; also the raw/wrestler_<id>/ dirname stem
# tool-dir      directory under tools/ whose build.sh produces the ROM
# built .nds    filename build.sh leaves in <tool-dir>/out/
# probe define  -D flag main.cpp gates the auto-run slot-2 setup behind
#               (see source/src/main.cpp DESMUME_*_PROBE)
# settle frame  emulated frame to wait for (perf-zones frame counter) before
#               requesting a screenshot - must be comfortably past the ROM's
#               own auto-run test pass, before it loops/idles
# label         human name for the report
#
# These are correctness gates, not fps numbers: run.sh diffs each capture's
# screenshot against the previous run's byte-for-byte (same ROM + same
# direct boot + no input == same pixels every time, so any difference is a
# real regression, not noise).

armwrestler  | armwrestler  | armwrestler.nds  | DESMUME_ARMWRESTLER_PROBE  | 300 | ARM9 instruction test (armwrestler)
arm7wrestler | arm7wrestler | arm7wrestler.nds | DESMUME_ARM7WRESTLER_PROBE | 300 | ARM7 instruction test (arm7wrestler)
rockwrestler | rockwrestler | rockwrestler.nds | DESMUME_ROCKWRESTLER_PROBE | 600 | System/IPC/DMA test suite (RockWrestler)
