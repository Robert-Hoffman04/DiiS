# desmumewii renderer-benchmark scenes.
#
#   id | rom | window | label | timeout | state
#
# id       short scene id; also the raw/perf_<id>_<mode>/ dirname stem (no '_')
# rom      path to the .nds; absolute, ~-relative, or relative to the repo root
# window   FRAME_LO-FRAME_HI to average over. Same ROM + direct boot + no input
#          is deterministic, so a fixed frame window is the same emulated
#          content every run - that's what makes runs comparable over time.
#          Blank = auto (25%..90% of the frames reached). run.sh also uses
#          FRAME_HI as capture.py's --until-frame: the run stops on its own
#          once that frame is reached, it does not sleep a guessed duration.
# label    human name for the report
# timeout  hard safety-net seconds passed to capture.py --timeout, in case a
#          build never reaches FRAME_HI (hang, crash, wrong renderer stalling
#          out). Must comfortably exceed the wall time the SLOWEST mode needs
#          to reach FRAME_HI. Blank = --timeout default.
# state    optional .ds0 savestate (repo-relative, ~-relative, or absolute).
#          When set, the harness stages it as sd:/DS/SAVES/test.ds0 and the
#          build (-DDESMUME_AUTOLOADSTATE) loads it ~90 frames in, so the run
#          starts from a fixed in-game point instead of relying on the
#          direct-boot intro being deterministic. Frame windows are still
#          counted from emulator start, so pick one comfortably past frame
#          90 + reset settle.
#
# Pick windows past the boot/logo frames and inside a single steady scene; a
# window that straddles a scene change shows up as a high cv% in the report.

vsd | tools/vsd-testrom/out/vsd_normal.nds                          | 180-1080 | Volumetric-shadow demo (heavy 3D) | 110
#ph  | Legend of Zelda, The - Phantom Hourglass (USA) (En,Fr,Es).nds | 300-900  | Phantom Hourglass (intro)         | 150
sm64 | Super Mario 64 DS (USA, Australia) (Rev 1).nds               | 150-1050 | Super Mario 64 DS (savestate) | 120 | tools/benchmark/states/sm64.ds0

# Pre-demo SM64DS screens are 2D on the MAIN engine, so these exercise the
# 2D compositor without any 3D core load. Windows sit before the attract-mode
# gameplay demo begins.
sm64boot  | Super Mario 64 DS (USA, Australia) (Rev 1).nds          | 90-200  | SM64DS boot screens (2D) | 60
sm64title | Super Mario 64 DS (USA, Australia) (Rev 1).nds          | 210-285 | SM64DS title screen      | 60

# 2D control - renderer choice is irrelevant here, the 3D core never runs.
# Point it at your own dump and uncomment:
# kirby | ~/roms/kirby-canvas-curse.nds | 600-3600 | Kirby Canvas Curse (2D only) | 90

# A second Phantom Hourglass window (the intro has two plateaus of different
# cost); uncomment to capture it too - reuses the same ROM, so it is a second
# boot, not free:
# phb | Legend of Zelda, The - Phantom Hourglass (USA) (En,Fr,Es).nds | 1020-1400 | Phantom Hourglass (intro, scene B) | 210
